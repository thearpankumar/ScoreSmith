name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

env:
  # Real Postgres service below, real psycopg (v3) URL — schema needs the `vector` and
  # `ltree` extensions, which is why the service uses the pgvector/pgvector:pg17 image
  # (see backend/alembic/versions/0001_initial_schema.py) rather than plain `postgres`.
  # The Postgres service container is throwaway and uses trust auth (see below), so no password exists at all.
  DATABASE_URL: postgresql+psycopg://qs_app@localhost:5432/quality_scorecard
  TEST_DATABASE_URL: postgresql+psycopg://qs_app@localhost:5432/quality_scorecard_test
  # Real Redis (service below) for the cluster-wide limiter tests; they are skipped when this is unset.
  TEST_REDIS_URL: redis://localhost:6379/0
  # No real AWS/Bedrock/AgentCore calls happen anywhere in the test suite (every AI-layer
  # test injects FakeBedrockClient / FakeWebSearchClient — see backend/tests/fakes.py), so
  # these are dummy/empty values, matching infra/.env.example's defaults.
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AGENTCORE_GATEWAY_WEB_SEARCH_URL: ""
  AGENTCORE_GATEWAY_WEB_SEARCH_TOOL_NAME: ""
  AGENTCORE_GATEWAY_AWS_ACCESS_KEY_ID: ""
  AGENTCORE_GATEWAY_AWS_SECRET_ACCESS_KEY: ""

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: qs_app
          POSTGRES_HOST_AUTH_METHOD: trust  # ephemeral CI database: no password to leak
          POSTGRES_DB: quality_scorecard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qs_app -d quality_scorecard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Create dedicated test database
        run: |
          psql -h localhost -U qs_app -d quality_scorecard \
            -c "CREATE DATABASE quality_scorecard_test OWNER qs_app;"

      - name: Run Alembic migrations
        run: alembic upgrade head

      # LangGraph's AsyncPostgresSaver.setup() (called lazily by the first AI-layer test
      # via app.ai.scorecard_builder.GraphManager) issues a CREATE INDEX CONCURRENTLY,
      # which blocks until every other transaction already open on the database finishes.
      # Running it here, alone, right after migrations and before pytest opens any of its
      # own concurrent connections, avoids the exact stall the code's own comments
      # describe hitting locally (see GraphManager._ensure_ready's docstring) — pytest's
      # own setup() call later is then a fast no-op since the schema already exists.
      - name: Warm up LangGraph checkpoint schema
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" python -c "
          import asyncio
          from app.ai.scorecard_builder import get_graph_manager

          async def main():
              gm = get_graph_manager()
              await gm.get_compiled_graph()
              await gm.aclose()

          asyncio.run(main())
          "

      - name: Run tests
        run: pytest --timeout=180 --timeout-method=thread

      - name: Run ruff
        run: ruff check .
