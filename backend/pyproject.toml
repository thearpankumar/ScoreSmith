[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quality-scorecard-backend"
version = "0.1.0"
description = "Quality Scorecard System backend — Phase 0 + Cycle 1 (data foundation + core CRUD API)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "email-validator==2.2.0",
  "pgvector==0.3.6",
  "SQLAlchemy-Utils==0.41.2",
  "python-dotenv==1.0.1",
  # --- Cycle 1c: AI core (Bedrock chat/judge/embeddings + LangGraph scorecard builder) ---
  "boto3==1.43.103",
  "langgraph==1.2.12",
  "langgraph-checkpoint-postgres==3.1.2",
  # httpx: real runtime dependency (not just test-only) as of the web_search tool
  # (app/ai/web_search.py) — the AgentCore Gateway client is built on httpx.AsyncClient,
  # signed by hand with SigV4 rather than via boto3 (no botocore service model for the
  # Gateway). Kept pinned to the same version the dev extra already used.
  "httpx==0.27.2",
  "simpleeval>=1.0.8",
  # --- AI evaluation pipeline: batch spreadsheet parsing (app/pipeline/batch_parser.py) ---
  "openpyxl>=3.1.5",
  # --- Excel export of evaluations (app/reporting/workbook.py): styled workbook writer ---
  "XlsxWriter>=3.2.0,<4",
]

[project.optional-dependencies]
dev = [
  "ruff==0.8.3",
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  # CI-only safety net: fails a hung test loudly instead of blocking the job forever (see
  # the "Warm up LangGraph checkpoint schema" CI step for the specific stall this guards
  # against — AsyncPostgresSaver.setup()'s CREATE INDEX CONCURRENTLY blocking on a
  # concurrently open transaction elsewhere in the test run).
  "pytest-timeout==2.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Report layout code and its table-style fixtures read better with long, flat lines.
"app/reporting/*.py" = ["E501"]
"tests/*export*.py" = ["E501"]
"tests/reporting_fixtures.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
