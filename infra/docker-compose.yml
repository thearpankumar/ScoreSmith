services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qs_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qs_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quality_scorecard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qs_pg_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qs_app} -d ${POSTGRES_DB:-quality_scorecard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qs_app}:${POSTGRES_PASSWORD:-qs_dev_password}@db:5432/${POSTGRES_DB:-quality_scorecard}
      # LLM provider: OpenRouter by default (LLM_PROVIDER=bedrock keeps the legacy Bedrock path,
      # which then needs AWS credentials in infra/.env). All values come from infra/.env; they
      # are listed explicitly so a new container always picks them up.
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL_ID: ${OPENROUTER_CHAT_MODEL_ID:-openai/gpt-6-luna}
      OPENROUTER_JUDGE_MODEL_ID: ${OPENROUTER_JUDGE_MODEL_ID:-deepseek/deepseek-v4.1-flash}
      OPENROUTER_MASTER_MODEL_ID: ${OPENROUTER_MASTER_MODEL_ID:-openai/gpt-6-luna}
      OPENROUTER_EMBEDDING_MODEL_ID: ${OPENROUTER_EMBEDDING_MODEL_ID:-openai/text-embedding-3-small}
      OPENROUTER_SEARCH_MODEL_ID: ${OPENROUTER_SEARCH_MODEL_ID:-openai/gpt-6-luna}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-low}
      OPENROUTER_WEB_SEARCH_ENGINE: ${OPENROUTER_WEB_SEARCH_ENGINE:-}
      # AI-evaluation AWS stack (S3 + Step Functions) of the OpenRouter deployment. These OR_* names
      # are deliberately different from the old Bedrock stack's so the two can never be mixed up.
      OR_S3_BUCKET: ${OR_S3_BUCKET:-}
      OR_SFN_STATE_MACHINE_ARN: ${OR_SFN_STATE_MACHINE_ARN:-}
      OR_AWS_APP_ACCESS_KEY_ID: ${OR_AWS_APP_ACCESS_KEY_ID:-}
      OR_AWS_APP_SECRET_ACCESS_KEY: ${OR_AWS_APP_SECRET_ACCESS_KEY:-}
      # OpenRouter Jev quality-gate key (see app/ai/jev_client.py / app/config.py's
      # openrouter_jev_api field) — already present via env_file above (infra/.env), but
      # listed explicitly here too, alongside the other AI-layer credentials, so a new
      # container is guaranteed to pick it up on `docker compose up` without relying
      # solely on env_file ordering/caching.
      OPENROUTER_JEV_API: ${OPENROUTER_JEV_API:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Browser-side fetches (NEXT_PUBLIC_* is exposed to client bundles) must hit the
      # backend the way the host machine sees it — localhost:8000 (the compose port map).
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # Server-side fetches (Next.js Server Components / route handlers, which run
      # *inside this container*) must instead use the Docker Compose service DNS name —
      # "backend", not "localhost" — since each container has its own network namespace.
      # Deliberately NOT prefixed NEXT_PUBLIC_ so it never leaks into the client bundle.
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  qs_pg_data:
