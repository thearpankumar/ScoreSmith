services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qs_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qs_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quality_scorecard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - qs_pg_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qs_app} -d ${POSTGRES_DB:-quality_scorecard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qs_app}:${POSTGRES_PASSWORD:-qs_dev_password}@db:5432/${POSTGRES_DB:-quality_scorecard}
      # This environment's AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (infra/.env) are, in
      # practice, an AWS Bedrock long-term "API key" (bearer-token credential), not a
      # SigV4 IAM access key/secret pair — using them as plain AWS_ACCESS_KEY_ID/
      # AWS_SECRET_ACCESS_KEY makes every Bedrock call fail with
      # `UnrecognizedClientException: The security token included in the request is
      # invalid` (confirmed live against this account). botocore's bearer-auth support
      # (see botocore/handlers.py::get_bearer_auth_supported_services, which lists
      # "bedrock") looks for AWS_BEARER_TOKEN_BEDROCK and prefers it automatically for
      # bedrock/bedrock-runtime calls when present; the value must be prefixed "A"
      # (confirmed live: without it, Bedrock rejects with "Invalid API Key format: Must
      # start with pre-defined prefix"). Standard AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
      # are left in place too (via env_file above) since they're harmless when unused and
      # some other AWS SDK call in this app (none currently) might still want them.
      AWS_BEARER_TOKEN_BEDROCK: A${AWS_SECRET_ACCESS_KEY}
      # OpenRouter Jev quality-gate key (see app/ai/jev_client.py / app/config.py's
      # openrouter_jev_api field) — already present via env_file above (infra/.env), but
      # listed explicitly here too, alongside the other AI-layer credentials, so a new
      # container is guaranteed to pick it up on `docker compose up` without relying
      # solely on env_file ordering/caching.
      OPENROUTER_JEV_API: ${OPENROUTER_JEV_API:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Browser-side fetches (NEXT_PUBLIC_* is exposed to client bundles) must hit the
      # backend the way the host machine sees it — localhost:8000 (the compose port map).
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      # Server-side fetches (Next.js Server Components / route handlers, which run
      # *inside this container*) must instead use the Docker Compose service DNS name —
      # "backend", not "localhost" — since each container has its own network namespace.
      # Deliberately NOT prefixed NEXT_PUBLIC_ so it never leaks into the client bundle.
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  qs_pg_data:
